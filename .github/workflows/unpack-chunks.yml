name: Import Reak toons source

on:
  push:
    branches: [main]
    paths:
      - 'upload/READY'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild archive
        run: |
          cat upload/part* > /tmp/reak.b64
          base64 -d /tmp/reak.b64 > /tmp/reak.zip
          rm -rf /tmp/reak-src
          mkdir -p /tmp/reak-src
          unzip -q /tmp/reak.zip -d /tmp/reak-src
      - name: Copy source to root
        run: |
          cp -a /tmp/reak-src/reak-toons-independent/. .
          rm -rf upload
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Importa código completo do Reak toons'
            git push
          fi
