<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b100d" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Wiki brasileira de Pocket Ants: criaturas, recursos, câmaras, mecânicas, guias e ferramentas." />
    <meta name="robots" content="index,follow" />
    <meta name="application-name" content="Pocket Ants Wiki BR" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ants Wiki" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://zeckofc143-hub.github.io/manga-bridge/" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./ant-wiki-icon.svg" type="image/svg+xml" />
    <meta property="og:title" content="Pocket Ants Wiki BR" />
    <meta property="og:description" content="Guias, criaturas, recursos, câmaras e ferramentas para Pocket Ants: Colony Simulator." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zeckofc143-hub.github.io/manga-bridge/" />
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const theme = localStorage.getItem('pa-theme');
          const language = localStorage.getItem('pa-language');
          const comfort = JSON.parse(localStorage.getItem('pa-visual-comfort-v1') || '{}');
          if (theme === 'dark' || theme === 'light') root.dataset.theme = theme;
          if (language === 'en') { root.lang = 'en'; root.dataset.language = 'en'; }
          else { root.lang = 'pt-BR'; root.dataset.language = 'pt'; }
          root.dataset.uxText = comfort.text === 'large' ? 'large' : 'standard';
          root.dataset.uxDensity = comfort.density === 'compact' ? 'compact' : 'comfortable';
          root.dataset.uxEffects = comfort.effects === 'reduced' ? 'reduced' : 'normal';
        } catch {}
      })();
    </script>
    <title>Pocket Ants Wiki BR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
